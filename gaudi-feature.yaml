{
  "manifest": "1.3",
  "id": "calendar.scheduling",
  "name": "Calendar Scheduling",
  "version": "0.2.2",
  "description": "Gestió de calendari i reserves sobre Cal.diy (Cal.com): event types, disponibilitat (slots), schedules, bookings (crear/get/cancel·lar/reprogramar/confirmar), enllaços de calendari i generació d'URLs de reserva amb opcions. Integració de producte open source (SPEC §15c): stack Cal.diy declarat a platform_services[] i jobs interns via daemons[].",
  "author": "2mes4-gaudi",
  "repository": {
    "type": "github",
    "url": "https://github.com/2mes4-gaudi/gaudi-calendar-scheduling",
    "main": "main"
  },
  "architecture": {
    "cli": true,
    "api": false,
    "agent": ["mastra"]
  },
  "dependencies": {
    "features": [],
    "packages": ["@gaudi/core@^1.9", "zod@^3.23"],
    "mcp": []
  },
  "messaging": {
    "queue": "gaudi.ona.notifications",
    "topics": [
      {
        "name": "gaudi.ona.notifications",
        "mode": "publish"
      }
    ]
  },
  "daemons": [
    {
      "id": "calcom-cron",
      "description": "Jobs periòdics de Cal.diy cada 5 min (recordatoris de reserves pendents, subscripcions de calendaris, triggers de webhooks) via /api/cron/* — MAI CronJob ad hoc (SPEC §14b/§15c)",
      "command": "node dist/bin.js scheduling cron-tick bookingReminder,calendar-subscriptions,webhookTriggers --json",
      "schedule": "*/5 * * * *",
      "enabled": true,
      "restart": "on-failure"
    },
    {
      "id": "calcom-maintenance",
      "description": "Manteniment horari de Cal.diy (changeTimeZone, selected-calendars, syncAppMeta, neteja de subscripcions)",
      "command": "node dist/bin.js scheduling cron-tick changeTimeZone,selected-calendars,syncAppMeta,calendar-subscriptions-cleanup --json",
      "schedule": "23 * * * *",
      "enabled": true,
      "restart": "on-failure"
    }
  ],
  "actions": [
    { "id": "scheduling.health", "destructive": false },
    { "id": "scheduling.me-get", "destructive": false },
    { "id": "scheduling.event-types-list", "destructive": false },
    { "id": "scheduling.event-types-get", "destructive": false },
    { "id": "scheduling.event-types-create", "destructive": false, "permission": "scheduling.write" },
    { "id": "scheduling.event-types-update", "destructive": false, "permission": "scheduling.write" },
    { "id": "scheduling.event-types-delete", "destructive": true, "confirm": "required", "permission": "scheduling.delete" },
    { "id": "scheduling.slots-list", "destructive": false },
    { "id": "scheduling.bookings-list", "destructive": false },
    { "id": "scheduling.bookings-get", "destructive": false },
    { "id": "scheduling.bookings-by-seat", "destructive": false },
    { "id": "scheduling.bookings-create", "destructive": false, "permission": "scheduling.write" },
    { "id": "scheduling.bookings-reschedule", "destructive": false, "permission": "scheduling.write" },
    { "id": "scheduling.bookings-cancel", "destructive": true, "confirm": "required", "permission": "scheduling.write" },
    { "id": "scheduling.bookings-confirm", "destructive": false, "permission": "scheduling.write" },
    { "id": "scheduling.bookings-decline", "destructive": true, "confirm": "required", "permission": "scheduling.write" },
    { "id": "scheduling.bookings-mark-absent", "destructive": false, "permission": "scheduling.write" },
    { "id": "scheduling.bookings-calendar-links", "destructive": false },
    { "id": "scheduling.bookings-references", "destructive": false },
    { "id": "scheduling.bookings-recordings", "destructive": false },
    { "id": "scheduling.bookings-transcripts", "destructive": false },
    { "id": "scheduling.bookings-conferencing-sessions", "destructive": false },
    { "id": "scheduling.schedules-list", "destructive": false },
    { "id": "scheduling.schedules-get", "destructive": false },
    { "id": "scheduling.schedules-default", "destructive": false },
    { "id": "scheduling.schedules-create", "destructive": false, "permission": "scheduling.write" },
    { "id": "scheduling.schedules-update", "destructive": false, "permission": "scheduling.write" },
    { "id": "scheduling.schedules-delete", "destructive": true, "confirm": "required", "permission": "scheduling.delete" },
    { "id": "scheduling.booking-url", "destructive": false },
    { "id": "scheduling.cron-tick", "destructive": false, "permission": "scheduling.write" },
    { "id": "scheduling.admin-deployment", "destructive": false, "permission": "scheduling.write" },
    { "id": "scheduling.admin-bootstrap", "destructive": false, "permission": "scheduling.write" },
    { "id": "scheduling.api-keys-list", "destructive": false },
    { "id": "scheduling.api-keys-create", "destructive": false, "permission": "scheduling.write" },
    { "id": "scheduling.api-keys-revoke", "destructive": true, "confirm": "required", "permission": "scheduling.delete" }
  ],
  "credentials": [
    {
      "id": "calendar.api-key",
      "type": "api-key",
      "required": true,
      "transport": ["env"],
      "defaultTransport": "env",
      "envVar": "GAUDI_CALENDAR_API_KEY",
      "scope": "platform",
      "description": "API key de Cal.diy (Bearer) per a l'API v2 (/v2/*). Com obtenir-la: obre https://cal.apps.ona.gaudi.2mes4.com → Settings → Developer → API Keys → Create, i desa-la amb `gaudi env set GAUDI_CALENDAR_API_KEY cal_... --scope platform`.",
      "validate": "node dist/bin.js scheduling me-get --json",
      "usedBy": ["scheduling.me-get", "scheduling.event-types-list", "scheduling.bookings-create"]
    },
    {
      "id": "calendar.cron-key",
      "type": "api-key",
      "required": true,
      "transport": ["env"],
      "defaultTransport": "env",
      "envVar": "GAUDI_CALENDAR_CRON_KEY",
      "scope": "platform",
      "description": "CRON_API_KEY de Cal.diy per als jobs interns (/api/cron/*). Com obtenir-la: el mateix valor que la clau CRON_API_KEY generada al Secret calcom-web (kubectl get secret calcom-web-secret -o jsonpath='{.data.CRON_API_KEY}' | base64 -d).",
      "usedBy": ["scheduling.cron-tick"]
    }
  ],
  "environment": [
    {
      "id": "api-base",
      "envVar": "GAUDI_CALENDAR_API_BASE",
      "description": "Base de l'API v2 de Cal.diy",
      "descriptionLong": "URL interna del servei d'API v2 (standalone). Al clúster: http://calcom-api:8080. En local: la URL pública + /api/v2.",
      "required": true,
      "secret": false,
      "scope": "platform",
      "usedBy": ["scheduling.me-get", "scheduling.event-types-list", "scheduling.slots-list", "scheduling.bookings-list", "scheduling.schedules-list"]
    },
    {
      "id": "web-base",
      "envVar": "GAUDI_CALENDAR_WEB_BASE",
      "description": "Base web de Cal.diy",
      "descriptionLong": "URL interna de l'app web (Next.js). Al clúster: http://calcom-web:3000. S'usa per als jobs interns /api/cron/*.",
      "required": true,
      "secret": false,
      "scope": "platform",
      "usedBy": ["scheduling.cron-tick"]
    },
    {
      "id": "public-url",
      "envVar": "GAUDI_CALENDAR_PUBLIC_URL",
      "description": "URL pública de Cal.diy",
      "descriptionLong": "URL pública de la interfície (https://cal.apps.ona.gaudi.2mes4.com). S'usa per generar enllaços de reserva i com a NEXT_PUBLIC_WEBAPP_URL del stack.",
      "required": true,
      "secret": false,
      "scope": "platform",
      "usedBy": ["scheduling.booking-url"]
    },
    {
      "id": "default-username",
      "envVar": "GAUDI_CALENDAR_DEFAULT_USERNAME",
      "description": "Username per defecte als enllaços de reserva",
      "descriptionLong": "Username de l'usuari de Cal.diy que es fa servir a scheduling.booking-url quan no s'especifica. Ex: eric",
      "required": false,
      "secret": false,
      "scope": "platform",
      "usedBy": ["scheduling.booking-url"]
    },
    {
      "id": "default-timezone",
      "envVar": "GAUDI_CALENDAR_DEFAULT_TIMEZONE",
      "description": "Timezone per defecte",
      "descriptionLong": "Timezone IANA per defecte als enllaços i consultes de slots. Ex: Europe/Madrid",
      "required": false,
      "secret": false,
      "scope": "platform",
      "usedBy": ["scheduling.booking-url", "scheduling.slots-list"]
    },
    {
      "id": "db-url",
      "envVar": "GAUDI_CALENDAR_DB_URL",
      "description": "Postgres de Cal.diy (mòdul d'administració)",
      "descriptionLong": "URL interna de la BD de Cal.diy (postgres://gaudi:<pw>@calcom-db-postgres:5432/postgres) per al provisioning d'usuaris i API keys des del CLI (la UI ho gateja com a funció comercial). Es copia del Secret calcom-db-postgres-secret. Els usuaris de plataforma es llegeixen de POSTGRES_URL (kernel_user_profiles).",
      "required": false,
      "secret": true,
      "scope": "platform",
      "usedBy": ["scheduling.admin-bootstrap", "scheduling.api-keys-create", "scheduling.api-keys-revoke"]
    },
    {
      "id": "disable-signup",
      "envVar": "GAUDI_CALENDAR_DISABLE_SIGNUP",
      "description": "Desactiva el registre d'usuaris a Cal.diy",
      "descriptionLong": "Posa-ho a 'true' DESPRÉS de crear el compte administrador: desactiva el signup de Cal.diy (NEXT_PUBLIC_DISABLE_SIGNUP) i requereix redeploy del servei calcom-web.",
      "required": false,
      "secret": false,
      "scope": "platform",
      "usedBy": []
    }
  ],
  "platform_services": [
    {
      "id": "calcom-db",
      "kind": "postgres",
      "description": "PostgreSQL dedicat de Cal.diy (esquema i migracions Prisma del producte)",
      "postgres": {
        "storage": "2Gi",
        "resources": {
          "requests": { "cpu": "100m", "memory": "256Mi" },
          "limits": { "memory": "512Mi" }
        }
      }
    },
    {
      "id": "calcom-cache",
      "kind": "cache",
      "description": "Redis de Cal.diy (rate limiting, caché i cues Bull)",
      "cache": {
        "maxmemory": "128mb",
        "persistence": true,
        "storage": "512Mi",
        "resources": {
          "requests": { "cpu": "50m", "memory": "64Mi" },
          "limits": { "memory": "192Mi" }
        }
      }
    },
    {
      "id": "calcom-web",
      "kind": "api",
      "description": "App web de Cal.diy (Next.js :3000) amb ingress TLS a cal.apps.ona.gaudi.2mes4.com. Bootstrap: migracions Prisma.",
      "api": {
        "name": "calcom-web",
        "image": "ghcr.io/2mes4-gaudi/caldiy-web:v6.2.0",
        "port": 3000,
        "env": [
          "NODE_ENV=production",
          "PORT=3000",
          "NEXT_PUBLIC_WEBAPP_URL=@ref:GAUDI_CALENDAR_PUBLIC_URL",
          "NEXT_PUBLIC_WEBSITE_URL=@ref:GAUDI_CALENDAR_PUBLIC_URL",
          "NEXTAUTH_URL=@ref:GAUDI_CALENDAR_PUBLIC_URL",
          "NEXTAUTH_SECRET=@secret:NEXTAUTH_SECRET",
          "CALENDSO_ENCRYPTION_KEY=@secret:CALENDSO_ENCRYPTION_KEY",
          "CRON_API_KEY=@secret:CRON_API_KEY",
          "DATABASE_URL=@postgres:calcom-db",
          "DATABASE_DIRECT_URL=@postgres:calcom-db",
          "REDIS_URL=@cache:calcom-cache",
          "CALCOM_TELEMETRY_DISABLED=1",
          "EMAIL_SERVER_HOST=@ref:GAUDI_SMTP_HOST",
          "EMAIL_SERVER_PORT=@ref:GAUDI_SMTP_PORT",
          "EMAIL_SERVER_USER=@ref:GAUDI_SMTP_USER",
          "EMAIL_SERVER_PASSWORD=@ref:GAUDI_SMTP_PASSWORD",
          "EMAIL_FROM=@ref:GAUDI_SMTP_FROM",
          "EMAIL_FROM_NAME=Cal.diy",
          "NEXT_PUBLIC_DISABLE_SIGNUP=@ref:GAUDI_CALENDAR_DISABLE_SIGNUP",
          "TZ=UTC"
        ],
        "secrets": ["NEXTAUTH_SECRET", "CALENDSO_ENCRYPTION_KEY", "CRON_API_KEY"],
        "ingress": {
          "host": "cal.apps.ona.gaudi.2mes4.com",
          "path": "/",
          "tls": true,
          "clusterIssuer": "letsencrypt-prod"
        },
        "resources": {
          "requests": { "cpu": "250m", "memory": "1Gi" },
          "limits": { "memory": "2Gi" }
        },
        "health": {
          "httpGet": { "path": "/", "port": 3000 },
          "initialDelaySeconds": 30,
          "periodSeconds": 20,
          "timeoutSeconds": 10
        },
        "bootstrap": {
          "command": ["npx", "prisma", "migrate", "deploy"],
          "timeoutSeconds": 900
        }
      }
    },
    {
      "id": "calcom-api",
      "kind": "api",
      "description": "API v2 standalone de Cal.diy (apps/api/v2) al clúster, consumida pel CLI i els agents (ClusterIP)",
      "api": {
        "name": "calcom-api",
        "image": "ghcr.io/2mes4-gaudi/caldiy-api-v2:v6.2.0-g1",
        "port": 8080,
        "env": [
          "NODE_ENV=production",
          "API_PORT=8080",
          "API_URL=http://calcom-api:8080",
          "WEB_APP_URL=@ref:GAUDI_CALENDAR_PUBLIC_URL",
          "DATABASE_URL=@postgres:calcom-db",
          "DATABASE_DIRECT_URL=@postgres:calcom-db",
          "DATABASE_READ_URL=@postgres:calcom-db",
          "DATABASE_WRITE_URL=@postgres:calcom-db",
          "REDIS_URL=@cache:calcom-cache",
          "NEXTAUTH_SECRET=@secret:NEXTAUTH_SECRET",
          "JWT_SECRET=@secret:NEXTAUTH_SECRET",
          "REWRITE_API_V2_PREFIX=true",
          "CALCOM_LICENSE_KEY=00000000-0000-0000-0000-000000000000",
          "IS_TEAM_BILLING_ENABLED=false",
          "STRIPE_API_KEY=sk_test_placeholder",
          "STRIPE_WEBHOOK_SECRET=whsec_placeholder"

        ],
        "resources": {
          "requests": { "cpu": "100m", "memory": "512Mi" },
          "limits": { "memory": "2Gi" }
        },
        "health": {
          "httpGet": { "path": "/health", "port": 8080 },
          "initialDelaySeconds": 20,
          "periodSeconds": 20,
          "timeoutSeconds": 10
        }
      }
    }
  ],
  "skills": [
    {
      "id": "scheduling",
      "source": "own",
      "name": "Calendar Scheduling",
      "description": "Skill per operar el calendari i les reserves (Cal.diy): consultar disponibilitat i reserves, crear/reprogramar/cancel·lar cites, gestionar event types i schedules, i generar URLs de reserva amb opcions. Usa el CLI `scheduling` (--json).",
      "version": "0.1.0"
    }
  ],
  "lifecycle": {
    "install": "scripts/install.sh",
    "uninstall": "scripts/uninstall.sh",
    "verify": "scripts/verify.sh"
  }
}
