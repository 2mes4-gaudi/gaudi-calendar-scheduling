name: docker (Cal.diy images)

# Construeix les imatges del producte Cal.diy pinades i les publica a ghcr:
#  - caldiy-web   (Next.js amb NEXT_PUBLIC_WEBAPP_URL incrustada)
#  - caldiy-api-v2 (API v2 standalone; upstream no en publica imatge)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      caldiy_ref:
        description: "Ref de calcom/cal.diy (per defecte v6.2.0)"
        default: "v6.2.0"

env:
  CALDIY_REF: v6.2.0
  WEBAPP_URL: https://cal.apps.ona.gaudi.2mes4.com

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout cal.diy (pin)
        uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ github.event.inputs.caldiy_ref || env.CALDIY_REF }}
          path: caldiy
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: caldiy
          file: caldiy/Dockerfile
          push: true
          tags: ghcr.io/2mes4-gaudi/caldiy-web:${{ github.event.inputs.caldiy_ref || env.CALDIY_REF }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=${{ env.WEBAPP_URL }}
            NEXT_PUBLIC_WEBSITE_URL=${{ env.WEBAPP_URL }}
            CALCOM_TELEMETRY_DISABLED=1

  build-api-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout cal.diy (pin)
        uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ github.event.inputs.caldiy_ref || env.CALDIY_REF }}
          path: caldiy
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push api v2
        uses: docker/build-push-action@v6
        with:
          context: caldiy
          file: caldiy/apps/api/v2/Dockerfile
          push: true
          tags: ghcr.io/2mes4-gaudi/caldiy-api-v2:${{ github.event.inputs.caldiy_ref || env.CALDIY_REF }}
